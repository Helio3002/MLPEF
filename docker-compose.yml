# MLPEF full stack — control plane (Postgres + control-api + admin-ui) and data
# plane (proxy). Bring it up with:
#
#   cp .env.example .env      # then edit the secrets
#   docker compose up --build
#
# Endpoints (default port mapping):
#   control-api  http://localhost:8080      (FastAPI; /docs for the API)
#   admin-ui     http://localhost:8081      (log in with MLPEF_ADMIN_* )
#   proxy        http://localhost:8090      (data-plane ingress; POST /v1/execute)
#
# The `sample-agent` service is under the `demo` profile so it does not run on a
# plain `up`. Run it on demand once you've granted a tool in the UI:
#   docker compose --profile demo run --rm sample-agent
#
# NOTE: the proxy runs with the sandbox DISABLED (no Docker-in-Docker). L1/L2/L5
# — validation, default-deny policy, HITL tokens, and the unskippable audit — are
# fully live; tool *execution* (L3/L4) is intentionally not wired here. See
# data-plane/proxy/server.py and THREAT_MODEL.md R-29.

name: mlpef

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  control-api:
    build:
      context: .
      dockerfile: control-plane/control-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MLPEF_ADMIN_USERNAME: ${MLPEF_ADMIN_USERNAME}
      MLPEF_ADMIN_PASSWORD: ${MLPEF_ADMIN_PASSWORD}
      MLPEF_CORS_ORIGINS: ${MLPEF_CORS_ORIGINS}
      MLPEF_HITL_PRIVATE_KEY_PEM: ${MLPEF_HITL_PRIVATE_KEY_PEM:-}
      MLPEF_SAMPLE_AGENT_ID: ${MLPEF_SAMPLE_AGENT_ID:-}
      MLPEF_SAMPLE_AGENT_API_KEY: ${MLPEF_SAMPLE_AGENT_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8080/healthz")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  admin-ui:
    build:
      context: ./control-plane/admin-ui
      args:
        # Same-origin: the UI calls /api/* and nginx reverse-proxies to control-api.
        # No absolute API URL is baked in, so this works identically on localhost
        # and on a Codespaces forwarded host with no rebuild.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      control-api:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  proxy:
    build:
      context: .
      dockerfile: data-plane/Dockerfile
    restart: unless-stopped
    depends_on:
      control-api:
        condition: service_healthy
    environment:
      MLPEF_CONTROL_PLANE_URL: http://control-api:8080
      # Send audit events to the control-plane store so the UI Audit Explorer +
      # chain verification show the demo end-to-end. This works because the demo
      # drives traffic as the single seeded sample-agent — the store binds each
      # event to the authenticated agent (THREAT_MODEL.md R-17). If the demo key
      # is unset, the proxy falls back to stdout auditing automatically.
      MLPEF_AUDIT_URL: http://control-api:8080
      MLPEF_AUDIT_AGENT_KEY: ${MLPEF_SAMPLE_AGENT_API_KEY:-}
      # Shared single-use nonce ledger (R-2): HITL token nonces are consumed via
      # the control-plane so single-use holds across a scaled proxy fleet, not
      # just within one process. Adds a hop only on the (rare) HITL-token path.
      MLPEF_NONCE_URL: http://control-api:8080
      MLPEF_NONCE_AGENT_KEY: ${MLPEF_SAMPLE_AGENT_API_KEY:-}
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8090/healthz")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # MLPEF MCP gateway — point any MCP-capable agent (Claude Desktop, Cline,
  # Cursor, LangGraph via langchain-mcp-adapters, …) at http://localhost:9000/sse
  # and its tool calls are governed by the full pipeline, no agent code changes.
  # Profile-gated (needs MLPEF_SAMPLE_AGENT_API_KEY set) so `up` stays clean:
  #   docker compose --profile mcp up --build
  # Represents ONE registered agent identity (set MLPEF_MCP_AGENT_* to use another).
  mcp-gateway:
    build:
      context: .
      dockerfile: data-plane/Dockerfile
    profiles: ["mcp"]
    restart: unless-stopped
    depends_on:
      control-api:
        condition: service_healthy
    environment:
      MLPEF_CONTROL_PLANE_URL: http://control-api:8080
      MLPEF_MCP_AGENT_ID: ${MLPEF_SAMPLE_AGENT_ID:-sample-agent-demo}
      MLPEF_MCP_AGENT_KEY: ${MLPEF_SAMPLE_AGENT_API_KEY:-}
      MLPEF_MCP_TENANT: default
      MLPEF_MCP_TOOLS: "fs.read,fs.write,shell.exec,http.get"
      MLPEF_MCP_TRANSPORT: sse
      MLPEF_MCP_PORT: "9000"
      # Govern this path identically to the HTTP proxy (audit + shared nonce ledger).
      MLPEF_AUDIT_URL: http://control-api:8080
      MLPEF_AUDIT_AGENT_KEY: ${MLPEF_SAMPLE_AGENT_API_KEY:-}
      MLPEF_NONCE_URL: http://control-api:8080
      MLPEF_NONCE_AGENT_KEY: ${MLPEF_SAMPLE_AGENT_API_KEY:-}
    command: ["python", "-m", "ingress.mcp_server"]
    ports:
      - "9000:9000"

  # Demo driver: calls a tool through the proxy with the seeded sample-agent
  # credential. One-shot (exits). Profile-gated so `up` stays clean.
  sample-agent:
    build:
      context: .
      dockerfile: data-plane/Dockerfile
    profiles: ["demo"]
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      MLPEF_INGRESS_URL: http://proxy:8090
      MLPEF_AGENT_ID: ${MLPEF_SAMPLE_AGENT_ID}
      MLPEF_AGENT_KEY: ${MLPEF_SAMPLE_AGENT_API_KEY}
    restart: "no"
    command: ["python", "ingress/examples/sample_agent.py"]

volumes:
  pgdata:
