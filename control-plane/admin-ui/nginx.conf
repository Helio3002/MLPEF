# Serve the SPA: static assets when they exist, else fall back to index.html so
# client-side routes (react-router) resolve on hard refresh / deep links.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the control-api under /api so the browser only ever talks to
    # ONE origin (this one): no cross-origin requests, so no CORS — and on GitHub
    # Codespaces the single forwarded port's "Continue" cookie covers the API too.
    # The trailing slash on proxy_pass strips the /api prefix
    # (/api/auth/login -> control-api:8080/auth/login). This location is more
    # specific than `/`, so it wins over the SPA fallback.
    location /api/ {
        proxy_pass http://control-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache fingerprinted assets; never cache the HTML entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
